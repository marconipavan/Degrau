folha: 6A 1
unidade: Mots familiers 1
a:
  instrucao: "Écoute et répète."
  traducao: "Ouça e repita cada palavra em voz alta."
  icone: ouvir
  blocos:
    - palavras:
        itens:
          - ["bonjour", "olá, bom dia"]
          - ["merci", "obrigado"]
          - ["un avion", "um avião"]
          - ["une ville", "uma cidade"]
          - ["la France", "a França"]
          - ["un étudiant", "um estudante"]
b:
  instrucao: "Relie."
  traducao: "Ligue cada palavra ao seu sentido."
  icone: ligar
  pontos_cada: 10
  blocos:
    - ligar: {itens_de: a, semente: 3}
