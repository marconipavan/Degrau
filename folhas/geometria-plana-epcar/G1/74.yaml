        transversal:
          direcao: 120
          marcas:
          - [r, acima-esquerda, x + 35°]
          - [s, acima-esquerda, 2x + 10°]
      - texto: Alternos internos. Quanto mede o ângulo em s, acima à direita?
        resposta: ['60', 60°]
        transversal:
          direcao: 60
          marcas:
          - [r, abaixo-direita, x + 80°]
          - [s, acima-esquerda, 3x]
      - texto: Alternos internos. Quanto mede o ângulo em r, abaixo à direita?
        resposta: ['110', 110°]
        transversal:
          direcao: 70
          marcas:
          - [r, abaixo-esquerda, 4x − 10°]
          - [s, acima-direita, 2x + 30°]
