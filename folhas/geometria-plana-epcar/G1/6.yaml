# convertido de G1_006.md (esqueletos gerados numa conversa do Claude; revisar)
folha: G1 6
unidade: Reconhecer ângulos 6
a:
  instrucao: Quanto mede cada fração de volta?
  icone: escrever
  pontos_cada: 10
  blocos:
  - exemplo:
      texto: ['Uma volta inteira mede 360°. Meia volta: 360° ÷ 2 = 180°.']
  - grade:
      colunas: 2
      itens:
      - texto: 1/4 de volta
        resposta: ['90', 90°]
      - texto: 1/2 de volta
        resposta: ['180', 180°]
      - texto: 1/3 de volta
        resposta: ['120', 120°]
      - texto: 1/6 de volta
        resposta: ['60', 60°]
      - texto: 1/8 de volta
        resposta: ['45', 45°]
      - texto: 1/12 de volta
        resposta: ['30', 30°]
      - texto: 3/4 de volta
        resposta: ['270', 270°]
      - texto: 2/3 de volta
        resposta: ['240', 240°]
      - texto: 1/36 de volta
        resposta: ['10', 10°]
      - texto: 1/360 de volta
        resposta: ['1', 1°]
b:
  instrucao: 'Classifique: A, R, O ou Ra.'
  icone: escrever
  pontos_cada: 10
  blocos:
  - grade:
      colunas: 2
      itens:
      - texto: 1/4 de volta
        resposta: [R, reto]
      - texto: 1/3 de volta
        resposta: [O, obtuso]
      - texto: 1/5 de volta
        resposta: [A, agudo]
      - texto: 1/2 de volta
        resposta: [Ra, raso, RA]
      - texto: 1/8 de volta
        resposta: [A, agudo]
      - texto: 3/8 de volta
        resposta: [O, obtuso]
      - texto: 1/6 de volta
        resposta: [A, agudo]
      - texto: 5/12 de volta
        resposta: [O, obtuso]
      - texto: 2/8 de volta
        resposta: [R, reto]
      - texto: 1/10 de volta
        resposta: [A, agudo]
