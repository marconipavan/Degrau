  icone: escrever
  pontos_cada: 10
  blocos:
  - exemplo:
      texto: [OV = opostos pelo vértice (1 e 3); LL = lado a lado no mesmo cruzamento (1 e 2).]
  - figura:
      transversal:
        direcao: 125
        marcas:
        - [r, acima-direita, '1']
        - [r, acima-esquerda, '2']
        - [r, abaixo-esquerda, '3']
        - [r, abaixo-direita, '4']
        - [s, acima-direita, '5']
        - [s, acima-esquerda, '6']
        - [s, abaixo-esquerda, '7']
        - [s, abaixo-direita, '8']
  - grade:
      colunas: 2
      itens:
      - texto: 1 e 3
        resposta: [OV, opostos pelo vértice]
      - texto: 2 e 6
        resposta: [CO, correspondentes]
      - texto: 5 e 6
        resposta: [LL, lado a lado]
      - texto: 3 e 5
        resposta: [AI, alternos internos]
      - texto: 6 e 8
        resposta: [OV, opostos pelo vértice]
      - texto: 1 e 8
        resposta: [CE, colaterais externos]
      - texto: 7 e 8
        resposta: [LL, lado a lado]
      - texto: 4 e 5
        resposta: [CI, colaterais internos]
      - texto: 2 e 4
        resposta: [OV, opostos pelo vértice]
      - texto: 1 e 7
        resposta: [AE, alternos externos]
