        cruzadas:
          direcoes: [0, 108]
          ponto: O
          marcas:
          - [0, 108, 3x]
          - [108, 180, 2x]
      - texto: 'Sobre uma reta: x, x e x + 30°. Quanto mede o maior?'
        resposta: ['80', 80°]
        semirretas:
          direcoes: [0, 50, 100, 180]
          nomes: [A, B, C, D]
          vertice: O
          marcas:
          - [A, B, null, x]
          - [B, C, null, x]
          - [C, D, null, x + 30°]
          comprimento: 15
