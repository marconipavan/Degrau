b:
  instrucao: Calcule o que se pede.
  icone: escrever
  pontos_cada: 20
  blocos:
  - grade:
      colunas: 2
      itens:
      - texto: AÔM = 2x + 20° e MÔB = 5x − 10°. Quanto mede AÔB?
        resposta: ['80', 80°]
        semirretas:
          direcoes: [0, 40, 80]
          nomes: [A, M, B]
          vertice: O
          marcas:
          - [A, M, null, 2x + 20°]
          - [M, B, null, 5x − 10°]
          comprimento: 15
      - texto: Retas se cruzam; um ângulo mede 2x e o oposto, x + 35°. Quanto mede 2x?
        resposta: ['70', 70°]
        cruzadas:
          direcoes: [0, 70]
          ponto: O
          marcas:
          - [0, 70, 2x]
          - [180, 250, x + 35°]
