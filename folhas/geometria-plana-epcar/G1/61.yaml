# convertido de G1_061.md (esqueletos gerados numa conversa do Claude; revisar)
folha: G1 61
unidade: 'Paralelas: identificar 1'
a:
  instrucao: Escreva o número do ângulo correspondente.
  icone: escrever
  pontos_cada: 25
  blocos:
  - exemplo:
      texto: ['Correspondentes ocupam a mesma posição em cada cruzamento: 1 (em r, acima à direita) e 5 (em s, acima
          à direita).']
  - figura:
      transversal:
        direcao: 60
        marcas:
        - [r, acima-direita, '1']
        - [r, acima-esquerda, '2']
        - [r, abaixo-esquerda, '3']
        - [r, abaixo-direita, '4']
        - [s, acima-direita, '5']
        - [s, acima-esquerda, '6']
        - [s, abaixo-esquerda, '7']
        - [s, abaixo-direita, '8']
  - grade:
      colunas: 1
      itens:
      - {texto: O correspondente do ângulo 1, resposta: '5'}
      - {texto: O correspondente do ângulo 2, resposta: '6'}
      - {texto: O correspondente do ângulo 3, resposta: '7'}
      - {texto: O correspondente do ângulo 4, resposta: '8'}
b:
  instrucao: São correspondentes? Responda S ou N.
  icone: escrever
  pontos_cada: 10
  blocos:
  - figura:
      transversal:
        direcao: 120
        marcas:
        - [r, acima-direita, '1']
        - [r, acima-esquerda, '2']
        - [r, abaixo-esquerda, '3']
        - [r, abaixo-direita, '4']
        - [s, acima-direita, '5']
        - [s, acima-esquerda, '6']
        - [s, abaixo-esquerda, '7']
        - [s, abaixo-direita, '8']
  - grade:
      colunas: 1
      itens:
      - texto: 2 e 6 são correspondentes?
        resposta: [S, Sim]
      - texto: 1 e 6 são correspondentes?
        resposta: [N, Não, Nao]
      - texto: 4 e 8 são correspondentes?
        resposta: [S, Sim]
      - texto: 3 e 5 são correspondentes?
        resposta: [N, Não, Nao]
      - texto: 3 e 7 são correspondentes?
        resposta: [S, Sim]
      - texto: 1 e 5 são correspondentes?
        resposta: [S, Sim]
      - texto: 2 e 8 são correspondentes?
        resposta: [N, Não, Nao]
      - texto: 5 e 1 são correspondentes?
        resposta: [S, Sim]
      - texto: 4 e 7 são correspondentes?
        resposta: [N, Não, Nao]
      - texto: 6 e 2 são correspondentes?
        resposta: [S, Sim]
