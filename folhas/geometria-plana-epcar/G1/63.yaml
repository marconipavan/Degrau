# convertido de G1_063.md (esqueletos gerados numa conversa do Claude; revisar)
folha: G1 63
unidade: 'Paralelas: identificar 3'
a:
  instrucao: Escreva o número do alterno externo.
  icone: escrever
  pontos_cada: 25
  blocos:
  - exemplo:
      texto: ['Alternos externos: fora das paralelas e em lados opostos da transversal: 1 e 7.']
  - figura:
      transversal:
        direcao: 65
        marcas:
        - [r, acima-direita, '1']
        - [r, acima-esquerda, '2']
        - [r, abaixo-esquerda, '3']
        - [r, abaixo-direita, '4']
        - [s, acima-direita, '5']
        - [s, acima-esquerda, '6']
        - [s, abaixo-esquerda, '7']
        - [s, abaixo-direita, '8']
  - grade:
      colunas: 1
      itens:
      - {texto: O alterno externo do ângulo 1, resposta: '7'}
      - {texto: O alterno externo do ângulo 2, resposta: '8'}
      - {texto: O alterno externo do ângulo 7, resposta: '1'}
      - {texto: O alterno externo do ângulo 8, resposta: '2'}
b:
  instrucao: São alternos externos? Responda S ou N.
  icone: escrever
  pontos_cada: 10
  blocos:
  - figura:
      transversal:
        direcao: 110
        marcas:
        - [r, acima-direita, '1']
        - [r, acima-esquerda, '2']
        - [r, abaixo-esquerda, '3']
        - [r, abaixo-direita, '4']
        - [s, acima-direita, '5']
        - [s, acima-esquerda, '6']
        - [s, abaixo-esquerda, '7']
        - [s, abaixo-direita, '8']
  - grade:
      colunas: 1
      itens:
      - texto: 1 e 7 são alternos externos?
        resposta: [S, Sim]
      - texto: 2 e 8 são alternos externos?
        resposta: [S, Sim]
      - texto: 1 e 8 são alternos externos?
        resposta: [N, Não, Nao]
      - texto: 2 e 7 são alternos externos?
        resposta: [N, Não, Nao]
      - texto: 3 e 5 são alternos externos?
        resposta: [N, Não, Nao]
      - texto: 7 e 1 são alternos externos?
        resposta: [S, Sim]
      - texto: 1 e 5 são alternos externos?
        resposta: [N, Não, Nao]
      - texto: 8 e 2 são alternos externos?
        resposta: [S, Sim]
      - texto: 4 e 6 são alternos externos?
        resposta: [N, Não, Nao]
      - texto: 2 e 6 são alternos externos?
        resposta: [N, Não, Nao]
